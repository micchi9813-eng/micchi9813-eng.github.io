// ===== 計算 =====
function sma(arr,n){
  return arr.map((_,i)=>{
    if(i<n-1)return null;
    return +(arr.slice(i-n+1,i+1).reduce((a,b)=>a+b,0)/n).toFixed(3);
  });
}
function ema(arr,n){
  const k=2/(n+1);const out=[];let p=null;
  for(let i=0;i<arr.length;i++){
    if(i<n-1){out.push(null);continue;}
    if(i===n-1){p=arr.slice(0,n).reduce((a,b)=>a+b)/n;out.push(+p.toFixed(4));continue;}
    p=arr[i]*k+p*(1-k);out.push(+p.toFixed(4));
  }
  return out;
}
function stdDev(arr,n){
  const m=sma(arr,n);
  return arr.map((_,i)=>{
    if(!m[i])return null;
    const sl=arr.slice(i-n+1,i+1);
    return +Math.sqrt(sl.reduce((a,b)=>a+(b-m[i])**2,0)/n).toFixed(4);
  });
}
function calcRSI(arr,n=14){
  const ch=arr.map((v,i)=>i===0?0:v-arr[i-1]);
  return arr.map((_,i)=>{
    if(i<n)return null;
    const sl=ch.slice(i-n+1,i+1);
    const g=sl.filter(c=>c>0).reduce((a,b)=>a+b,0)/n;
    const l=sl.filter(c=>c<0).reduce((a,b)=>a+Math.abs(b),0)/n;
    return l===0?100:+(100-100/(1+g/l)).toFixed(1);
  });
}
function calcMACD(arr){
  const e12=ema(arr,12),e26=ema(arr,26);
  const ml=arr.map((_,i)=>e12[i]&&e26[i]?+(e12[i]-e26[i]).toFixed(4):null);
  const k=2/10;const sg=[];let p=null;
  for(let i=0;i<ml.length;i++){
    if(!ml[i]){sg.push(null);continue;}
    p=p===null?ml[i]:ml[i]*k+p*(1-k);sg.push(+p.toFixed(4));
  }
  return{ml,sg,hist:ml.map((v,i)=>v&&sg[i]?+(v-sg[i]).toFixed(4):null)};
}
function rand(seed){
  let s=seed;
  return()=>{s=(s*1664525+1013904223)&0xffffffff;return(s>>>0)/0xffffffff;};
}
function fillNull(arr){
  const first=arr.find(v=>v!==null)??0;
  return arr.map(v=>v===null?first:v);
}

// ===== 共通UI =====
const TIP_STYLE={background:"#0f1923",border:"1px solid #2a3f55",borderRadius:6,padding:"7px 11px",fontSize:11};
const Tip=({active,payload,label})=>{
  if(!active||!payload?.length)return null;
  return <div style={TIP_STYLE}>
    <p style={{color:"#94a3b8",margin:"0 0 3px"}}>Day {label}</p>
    {payload.map((p,i)=>p.value!=null&&<p key={i} style={{color:p.color||p.fill||"#fff",margin:"1px 0"}}>{p.name}: {Number(p.value).toFixed(3)}</p>)}
  </div>;
};

const MG={left:0,right:8,top:8,bottom:0};
const MG_CROSS={left:0,right:8,top:32,bottom:0};
const TK={fill:"#475569",fontSize:9};
function ax(data){return{dataKey:"i",tick:TK,tickLine:false,axisLine:{stroke:"#1e3a52"},tickFormatter:v=>`${v}日`,interval:Math.floor(data.length/5)};}
function ay(mn,mx){return{domain:[mn,mx],tick:TK,tickLine:false,axisLine:false,tickFormatter:v=>v.toFixed(1),width:40};}

// ===== MAガイド チャートコンポーネント =====
function MAChart1({data}){
  const mn=+(Math.min(...data.map(d=>d.price))-.8).toFixed(1);
  const mx=+(Math.max(...data.map(d=>d.price))+.8).toFixed(1);
  return <div style={BX}><ResponsiveContainer width="100%" height={200}>
    <ComposedChart data={data} margin={MG}>
      <XAxis {...ax(data)}/><YAxis {...ay(mn,mx)}/><Tooltip content={<Tip/>}/>
      <Line type="monotone" dataKey="price" name="価格" stroke="#34d399" strokeWidth={1.5} dot={false}/>
    </ComposedChart>
  </ResponsiveContainer></div>;
}
function MAChart2({data}){
  const allV=data.flatMap(d=>[d.price,d.ma21,d.ma75]).filter(v=>v!=null);
  const mn=+(Math.min(...allV)-.8).toFixed(1);
  const mx=+(Math.max(...allV)+.8).toFixed(1);
  return <div style={BX}><ResponsiveContainer width="100%" height={200}>
    <ComposedChart data={data} margin={MG}>
      <XAxis {...ax(data)}/><YAxis {...ay(mn,mx)}/><Tooltip content={<Tip/>}/>
      <Line type="monotone" dataKey="ma75" name="75日MA" stroke="#fb923c" strokeWidth={2.5} dot={false} connectNulls/>
      <Line type="monotone" dataKey="ma21" name="21日MA" stroke="#38bdf8" strokeWidth={2} dot={false} connectNulls/>
      <Line type="monotone" dataKey="price" name="価格" stroke="#34d399" strokeWidth={1.5} dot={false}/>
    </ComposedChart>
  </ResponsiveContainer></div>;
}
function MAChartCross({data,crossIdx,crossType}){
  const allV=data.flatMap(d=>[d.price,d.ma21,d.ma75]).filter(v=>v!=null);
  const mn=+(Math.min(...allV)-.8).toFixed(1);
  const mx=+(Math.max(...allV)+.8).toFixed(1);
  const color=crossType==="golden"?"#4ade80":"#f87171";
  const label=crossType==="golden"?"★ゴールデンクロス（買い）":"★デッドクロス（売り）";
  return <div style={BX}><ResponsiveContainer width="100%" height={210}>
    <ComposedChart data={data} margin={MG_CROSS}>
      <XAxis {...ax(data)}/><YAxis {...ay(mn,mx)}/><Tooltip content={<Tip/>}/>
      {crossIdx&&<ReferenceLine x={crossIdx} stroke={color} strokeWidth={2} strokeDasharray="5 3"
        label={{value:label,position:"insideTopLeft",fill:color,fontSize:11}}/>}
      <Line type="monotone" dataKey="ma75" name="75日MA" stroke="#fb923c" strokeWidth={2.5} dot={false} connectNulls/>
      <Line type="monotone" dataKey="ma21" name="21日MA" stroke="#38bdf8" strokeWidth={2} dot={false} connectNulls/>
      <Line type="monotone" dataKey="price" name="価格" stroke="#34d399" strokeWidth={1.5} dot={false}/>
    </ComposedChart>
  </ResponsiveContainer></div>;
}

function dataBB(){
  const r=rand(42);const p=[];
  for(let i=0;i<28;i++) p.push(+(160+Math.sin(i*.7)*.25+(r()-.5)*.12).toFixed(3));
  for(let i=0;i<28;i++) p.push(+(160.3+i*.09+Math.sin(i*.5)*.35+(r()-.5)*.1).toFixed(3));
  for(let i=0;i<18;i++) p.push(+(162.8-i*.08+(r()-.5)*.15).toFixed(3));
  const m=fillNull(sma(p,20)),s=fillNull(stdDev(p,20));
  return p.map((price,i)=>({i:i+1,price,mid:m[i],upper:+(m[i]+2*s[i]).toFixed(3),lower:+(m[i]-2*s[i]).toFixed(3)}));
}

function ChartMACD({data}){
  const mn=+(Math.min(...data.map(d=>d.price))-.5).toFixed(1);

  return <><div style={BX}><ResponsiveContainer width="100%" height={140}>
    <ComposedChart data={data} margin={MG}>
      <XAxis {...ax(data)}/><YAxis {...ay(mn,mx)}/><Tooltip content={<Tip/>}/>

// ===== 共通ナビバー =====
function NavBar({scene,total,scenes,onSet}){
  return <div style={{display:"flex",justifyContent:"space-between",gap:10}}>
    <button onClick={()=>onSet(Math.max(0,scene-1))} disabled={scene===0} style={{flex:1,padding:"11px",background:scene===0?"#1e3a52":"#1a2d42",color:scene===0?"#475569":"#94a3b8",border:"1px solid #1e3a52",borderRadius:8,cursor:scene===0?"not-allowed":"pointer",fontSize:13,fontWeight:600}}>← 前へ</button>
    <div style={{display:"flex",gap:5,alignItems:"center"}}>
      {scenes.map((_,i)=><div key={i} onClick={()=>onSet(i)} style={{width:i===scene?16:5,height:5,borderRadius:3,background:i===scene?"#3b82f6":"#1e3a52",cursor:"pointer",transition:"all 0.3s"}}/>)}
    </div>
    <button onClick={()=>onSet(Math.min(total-1,scene+1))} disabled={scene===total-1} style={{flex:1,padding:"11px",background:scene===total-1?"#1e3a52":"#1d4ed8",color:scene===total-1?"#475569":"#fff",border:"none",borderRadius:8,cursor:scene===total-1?"not-allowed":"pointer",fontSize:13,fontWeight:700}}>次へ →</button>
  </div>;
}
